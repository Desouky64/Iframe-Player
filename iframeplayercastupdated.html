<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karma's Website</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121319;
    --panel: #1B1D25;
    --panel-raised: #21232C;
    --line: #2C2F3A;
    --text: #ECE9E2;
    --text-dim: #8C8F9C;
    --amber: #FF7A33;
    --amber-dim: #6E3A1C;
    --teal: #2EC4B6;
    --red: #E2453A;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
  }

  .console{
    width: 100%;
    max-width: 880px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px;
    position: relative;
  }

  .console::before{
    content:"";
    position:absolute;
    top:10px; left:10px; right:10px; bottom:10px;
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 12px;
    pointer-events:none;
  }

  .marquee{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .marquee h1{
    font-family: 'Bebas Neue', sans-serif;
    font-size: 44px;
    letter-spacing: 2px;
    margin: 0;
    color: var(--text);
    line-height: 1;
  }

  .marquee h1 span{
    color: var(--amber);
  }

  .channel-tag{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    letter-spacing: 1px;
  }

  .tuner{
    display:flex;
    gap: 10px;
    margin-bottom: 12px;
  }

  .tuner input{
    flex:1;
    min-width: 0;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 13px 16px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .tuner input::placeholder{
    color: var(--text-dim);
  }

  .tuner input:focus{
    border-color: var(--amber);
  }

  .tuner button{
    background: var(--amber);
    color: #1A1100;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    display:flex;
    align-items:center;
    gap: 8px;
    transition: filter 0.15s ease, transform 0.05s ease;
    white-space: nowrap;
  }

  .tuner button:hover{ filter: brightness(1.08); }
  .tuner button:active{ transform: scale(0.97); }

  .tuner button svg{ width:14px; height:14px; }

  .options-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }

  .hint{
    font-size: 12px;
    color: var(--text-dim);
    margin: 0;
  }

  .toggle-wrap{
    display:flex;
    align-items:center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }

  .switch{
    position: relative;
    width: 34px;
    height: 19px;
    flex-shrink: 0;
  }

  .switch input{
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider{
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: var(--line);
    border-radius: 999px;
    transition: background 0.15s ease;
  }

  .slider::before{
    content:"";
    position: absolute;
    height: 13px; width: 13px;
    left: 3px; top: 3px;
    background: var(--text-dim);
    border-radius: 50%;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .switch input:checked + .slider{ background: var(--amber-dim); }
  .switch input:checked + .slider::before{
    transform: translateX(15px);
    background: var(--amber);
  }

  .toggle-wrap span.state{ color: var(--text); }

  .screen-wrap{
    background: #000;
    border-radius: 12px;
    border: 1px solid var(--line);
    overflow: hidden;
    position: relative;
    aspect-ratio: 16 / 9;
  }

  .screen-wrap iframe{
    width: 100%;
    height: 100%;
    border: none;
    display: none;
  }

  .static-screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 14px;
    background:
      repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.025) 0px,
        rgba(255,255,255,0.025) 1px,
        transparent 1px,
        transparent 3px
      ),
      #0B0B0E;
  }

  .static-screen .ring{
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .static-screen .ring svg{
    width: 22px; height: 22px;
    fill: var(--text-dim);
  }

  .static-screen p{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    margin: 0;
    text-align: center;
    padding: 0 20px;
  }

  .status-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 16px;
  }

  .status{
    display:flex;
    align-items:center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--text-dim);
  }

  .dot{
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
  }

  .dot.live{
    background: var(--red);
    box-shadow: 0 0 0 3px rgba(226,69,58,0.18);
  }

  .right-actions{
    display:flex;
    align-items:center;
    gap: 16px;
  }

  .cast-btn{
    background: none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 7px 14px;
    border-radius: 8px;
    display:flex;
    align-items:center;
    gap: 7px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .cast-btn svg{ width:14px; height:14px; fill: currentColor; }

  .cast-btn:hover{ border-color: var(--teal); color: var(--teal); }
  .cast-btn.casting{ border-color: var(--teal); color: var(--teal); }

  .clear-btn{
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
    padding: 0;
  }

  .clear-btn:hover{ color: var(--text); }

  @media (max-width: 520px){
    .marquee h1{ font-size: 34px; }
    .tuner{ flex-direction: column; }
    .tuner button{ padding: 12px; justify-content:center; }
  }
</style>
</head>
<body>

  <main class="console">
    <div class="marquee">
      <h1>KARMA'S <span>WEBSITE</span></h1>
      <div class="channel-tag">EMBED PLAYER</div>
    </div>

    <div class="tuner">
      <input id="linkInput" type="text" placeholder="Paste an embed link or <iframe> code here" autocomplete="off" />
      <button id="playBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Play
      </button>
    </div>

    <div class="options-row">
      <p class="hint">Works with any direct embed URL or a full &lt;iframe&gt; tag. Nothing is uploaded — it loads straight in your browser.</p>
      <label class="toggle-wrap" for="adBlockToggle">
        <div class="switch">
          <input type="checkbox" id="adBlockToggle" checked>
          <span class="slider"></span>
        </div>
        <span>AD BLOCK: <span class="state" id="adBlockState">ON</span></span>
      </label>
    </div>

    <div class="screen-wrap">
      <iframe id="player" allowfullscreen allow="encrypted-media; picture-in-picture; autoplay"></iframe>
      <div class="static-screen" id="staticScreen">
        <div class="ring">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <p id="statusText">NO SIGNAL — PASTE A LINK TO BEGIN</p>
      </div>
    </div>

    <div class="status-row">
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusLabel">STANDBY</span>
      </div>
      <div class="right-actions">
        <button class="cast-btn" id="castBtn" title="Cast to a Chromecast-compatible device">
          <svg viewBox="0 0 24 24"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
          <span id="castLabel">Cast</span>
        </button>
        <button class="clear-btn" id="clearBtn">Clear</button>
      </div>
    </div>
  </main>

<script>
  const linkInput = document.getElementById('linkInput');
  const playBtn = document.getElementById('playBtn');
  const player = document.getElementById('player');
  const staticScreen = document.getElementById('staticScreen');
  const statusDot = document.getElementById('statusDot');
  const statusLabel = document.getElementById('statusLabel');
  const statusText = document.getElementById('statusText');
  const clearBtn = document.getElementById('clearBtn');
  const adBlockToggle = document.getElementById('adBlockToggle');
  const adBlockState = document.getElementById('adBlockState');
  const castBtn = document.getElementById('castBtn');
  const castLabel = document.getElementById('castLabel');

  // Known ad/redirect-network domains. Blocks loading a link that points
  // straight at one of these. This is a small illustrative list, not an
  // exhaustive filter list.
  const AD_DOMAINS = [
    'doubleclick.net','googlesyndication.com','googleadservices.com',
    'adnxs.com','popads.net','propellerads.com','exoclick.com',
    'juicyads.com','adsterra.com','revcontent.com','taboola.com',
    'outbrain.com','mgid.com','clickadu.com','hilltopads.net',
    'popcash.net','adskeeper.co.uk','adform.net'
  ];

  function extractSrc(raw){
    const trimmed = raw.trim();
    const match = trimmed.match(/<iframe[^>]*\ssrc=["']([^"']+)["']/i);
    if (match) return match[1];
    return trimmed;
  }

  function isLikelyUrl(str){
    try{
      const u = new URL(str);
      return u.protocol === 'http:' || u.protocol === 'https:';
    }catch(e){
      return false;
    }
  }

  function isAdDomain(str){
    try{
      const host = new URL(str).hostname.toLowerCase();
      return AD_DOMAINS.some(d => host === d || host.endsWith('.' + d));
    }catch(e){
      return false;
    }
  }

  function applySandbox(){
    // Ad-block ON: sandbox the iframe without allow-popups / allow-top-navigation.
    // That's what actually stops popup ads, popunders, and full-page redirect
    // hijacks from embed pages — it can't remove ads baked into the embedded
    // page itself, since that content is cross-origin and off-limits to us.
    if (adBlockToggle.checked){
      player.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-presentation allow-fullscreen');
    } else {
      player.removeAttribute('sandbox');
    }
  }

  adBlockToggle.addEventListener('change', () => {
    adBlockState.textContent = adBlockToggle.checked ? 'ON' : 'OFF';
    applySandbox();
    // Re-apply to a currently loaded source so the toggle takes effect live.
    if (player.src) {
      const current = player.src;
      player.src = current;
    }
  });

  function loadLink(){
    const src = extractSrc(linkInput.value);
    if (!src){
      statusText.textContent = 'NO LINK ENTERED';
      return;
    }
    if (!isLikelyUrl(src)){
      statusText.textContent = "COULDN'T READ THAT LINK — CHECK IT AND TRY AGAIN";
      return;
    }
    if (adBlockToggle.checked && isAdDomain(src)){
      statusText.textContent = 'BLOCKED — THIS LOOKS LIKE AN AD/REDIRECT LINK';
      return;
    }
    applySandbox();
    player.src = src;
    player.style.display = 'block';
    staticScreen.style.display = 'none';
    statusDot.classList.add('live');
    statusLabel.textContent = 'PLAYING';
  }

  function clearPlayer(){
    player.src = '';
    player.style.display = 'none';
    staticScreen.style.display = 'flex';
    statusText.textContent = 'NO SIGNAL — PASTE A LINK TO BEGIN';
    statusDot.classList.remove('live');
    statusLabel.textContent = 'STANDBY';
    linkInput.value = '';
  }

  playBtn.addEventListener('click', loadLink);
  clearBtn.addEventListener('click', clearPlayer);
  linkInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loadLink();
  });

  // --- Casting -----------------------------------------------------------
  // Uses the standard W3C Presentation API, which works with actual
  // Chromecast-protocol receivers (Chromecast dongles, Chromecast built-in
  // devices, some Android/Google TVs) in Chrome/Edge. Most Samsung TVs do
  // NOT speak this protocol natively — they use their own AirPlay/Tizen
  // "Smart View" ecosystem instead, which no website can trigger directly.
  // If no compatible receiver is found, or the browser lacks the API, we
  // say so plainly rather than pretending it worked.
  let presentConnection = null;

  async function startCast(){
    if (!('PresentationRequest' in window)){
      statusText.textContent = 'CASTING NOT SUPPORTED IN THIS BROWSER — TRY CHROME/EDGE, OR USE YOUR TV\u2019S SCREEN MIRRORING';
      staticScreen.style.display = player.src ? 'none' : 'flex';
      return;
    }
    try{
      const request = new PresentationRequest([window.location.href]);
      const connection = await request.start();
      presentConnection = connection;
      castBtn.classList.add('casting');
      castLabel.textContent = 'Casting';
      connection.addEventListener('close', resetCastButton);
      connection.addEventListener('terminate', resetCastButton);
    }catch(err){
      // Most common cause: no Cast-protocol receiver found on the network.
      statusText.textContent = 'NO CAST-COMPATIBLE DEVICE FOUND (SAMSUNG TVS TYPICALLY NEED A CHROMECAST DONGLE OR SMART VIEW INSTEAD)';
    }
  }

  function resetCastButton(){
    castBtn.classList.remove('casting');
    castLabel.textContent = 'Cast';
    presentConnection = null;
  }

  castBtn.addEventListener('click', () => {
    if (presentConnection){
      presentConnection.terminate();
      resetCastButton();
    } else {
      startCast();
    }
  });
</script>

</body>
</html>
